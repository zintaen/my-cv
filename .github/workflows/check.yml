---
name: 🧪 CI - Check
on:
  workflow_dispatch:
  pull_request:
jobs:
  check:
    name: 🧪 Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7  # v6.0.1

      - name: Env & Deps
        uses: cyberskill-world/.github/actions/env-deps@main

      - name: Validate CV content and production build
        run: |
          pnpm run check:data
          pnpm run build

      - name: Lint
        uses: cyberskill-world/.github/actions/lint@main
