name: Deploy static content to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v4.1.1
      - name: Install pnpm
        uses: pnpm/action-setup@v6 # v3.0.0
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v7 # v4.0.2
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Install Chromium for Puppeteer
        run: pnpm exec puppeteer browsers install chrome
        
      - name: Generate PDF
        run: pnpm run pdf
        
      - name: Build
        run: pnpm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5 # v4.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4 # v3.0.1
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # v4.0.5
