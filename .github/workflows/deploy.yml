name: Deploy static content to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome for Puppeteer
        run: |
          pnpm exec puppeteer browsers install chrome
          CHROME_PATH="$(pnpm exec node -e "console.log(require('puppeteer').executablePath())")"
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          echo "Using Chrome at $CHROME_PATH"
          test -x "$CHROME_PATH"

      # Build first so PDF generation serves dist/ via a plain Node static server.
      - name: Build site
        run: pnpm run build

      - name: Generate PDF
        timeout-minutes: 3
        run: pnpm run pdf public/Stephen_Cheng_CV.pdf
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ env.PUPPETEER_EXECUTABLE_PATH }}
          PDF_TIMEOUT_MS: "90000"

      # Rebuild so dist/ includes the freshly generated PDF from public/.
      - name: Rebuild with PDF asset
        run: pnpm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
